name: Build Android APK

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode keystore
        working-directory: android
        run: echo "${{ secrets.BASE }}" | base64 -d > .ks
      - name: Build APK
        working-directory: android
        env:
          PSWD: ${{ secrets.PSWD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/.ks \
            -Pandroid.injected.signing.store.password="$PSWD" \
            -Pandroid.injected.signing.key.alias=qlens \
            -Pandroid.injected.signing.key.password="$PSWD"
      - name: Delete keystore
        if: always()
        working-directory: android
        run: rm -rf .ks
      - name: Get Github release options
        id: options
        run: |
          v=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
      - name: Upload to Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.options.outputs.version }}
          name: QLens
          body: "Release build"
          files: ${{ steps.options.outputs.path }}
      - name: Prune old releases (keep latest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r old_tag; do
              echo "Deleting release + tag: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag
            done