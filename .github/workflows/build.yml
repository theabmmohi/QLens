name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Decode keystore
        working-directory: android
        run: echo "${{ secrets.BASE }}" | base64 -d > .ks
      - name: Build APK
        working-directory: android
        env:
          PSWD: ${{ secrets.PSWD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/.ks \
            -Pandroid.injected.signing.store.password="$PSWD" \
            -Pandroid.injected.signing.key.alias=qlens \
            -Pandroid.injected.signing.key.password="$PSWD"
      - name: Delete keystore
        if: always()
        working-directory: android
        run: rm -rf .ks
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QLens
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1